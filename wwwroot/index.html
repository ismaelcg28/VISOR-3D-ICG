<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.99/style.css">
    <link rel="stylesheet" href="/main.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1f2937">
    <title>VISOR 3D ICG</title>
</head>

<body>
    <div id="header">
        <a class="brand" href="/" aria-label="VISOR 3D ICG inicio">
            <img class="logo" src="/icon.svg" alt="">
            <span class="title">VISOR 3D ICG</span>
        </a>
        <select name="models" id="models"></select>
        <button id="offline" title="Guardar este modelo en el dispositivo">Preparar offline</button>
        <button id="export-offline" title="Crear paquete para la APK offline">Exportar .visor3d</button>
        <button id="manage-models" title="Seleccionar y eliminar proyectos cargados">Proyectos</button>
        <button id="install" hidden>Instalar aplicación</button>
        <button id="upload" title="Upload New Model">Upload</button>
        <input style="display: none" type="file" id="input">
    </div>
    <dialog id="models-dialog" aria-labelledby="models-dialog-title">
        <form method="dialog" class="dialog-heading">
            <h2 id="models-dialog-title">Proyectos cargados</h2>
            <button aria-label="Cerrar">✕</button>
        </form>
        <p>Marca los proyectos que ya no necesites.</p>
        <div id="managed-model-list"></div>
        <div class="dialog-actions">
            <button id="delete-models" type="button" disabled>Eliminar seleccionados</button>
            <button id="close-models" type="button">Cerrar</button>
        </div>
    </dialog>
    <div id="preview"></div>
    <div id="overlay"></div>
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.99/viewer3D.js"></script>
    <script src="/main.js?v=16" type="module"></script>
</body>

</html>
